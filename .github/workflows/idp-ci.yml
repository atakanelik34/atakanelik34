name: idp-ci

on:
  push:
    paths: ["idp/**", ".github/workflows/idp-ci.yml"]
  pull_request:
    paths: ["idp/**", ".github/workflows/idp-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idp/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idp
          POSTGRES_PASSWORD: idp
          POSTGRES_DB: idp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idp -d idp_test" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://idp:idp@localhost:5432/idp_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: idp/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      # Real Tesseract, so the @needs_tesseract OCR tests run instead of skipping.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu
      - run: ruff check src tests migrations
      - run: ruff format --check src tests migrations
      - run: mypy
      - name: Migrations have no drift
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ci-only-secret-value-that-is-long-enough-000
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: idp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t idp-backend:ci idp/backend
      - run: docker build idp/frontend
      - name: Runtime image imports every entry point (no dev-only dependencies)
        run: >-
          docker run --rm -e JWT_SECRET=ci-only-secret-value-that-is-long-enough-000
          idp-backend:ci python -c "import idp.main, idp.workers.main, idp.cli; idp.main.create_app()"
      # The default image ships Tesseract: OCR a scan-like page (and any real scans
      # committed under backend/tests/fixtures/scans) with the production digitizer.
      - name: Real OCR inside the default image (Tesseract)
        run: >-
          docker run --rm -v "$PWD/idp:/src:ro" -e PYTHONPATH=/src/backend
          -e JWT_SECRET=ci-only-secret-value-that-is-long-enough-000
          idp-backend:ci python /src/scripts/validation/ocr_check.py
