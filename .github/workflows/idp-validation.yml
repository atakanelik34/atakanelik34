name: idp-validation

# Production validation: fault-injection suite + live Compose stack checks.
# Long-running, so it runs nightly and on demand rather than on every push.
on:
  workflow_dispatch:
    inputs:
      uploads:
        description: Concurrent uploads for the stack flood test
        default: "100"
      pages:
        description: Page count for the high-page-count PDF
        default: "500"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: idp/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idp
          POSTGRES_PASSWORD: idp
          POSTGRES_DB: idp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idp -d idp_test" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://idp:idp@localhost:5432/idp_test
      TEST_REDIS_URL: redis://localhost:6379/15
      VALIDATION_REPORT: ${{ github.workspace }}/idp/validation-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: idp/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      # Strict xfails encode known defects: the job fails if one is fixed (update the test)
      # or if any other scenario regresses.
      - run: pytest -m validation -rx -p no:logging
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: idp/validation-report.json

  live-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: fault-injection
    defaults:
      run:
        working-directory: idp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m venv backend/.venv && backend/.venv/bin/pip install -e 'backend[dev]'
      - run: python3 scripts/gen-env.py
      # The flood measures the upload path, not the per-principal upload limit
      # (the fault-injection job covers that), so raise it for this stack.
      - run: sed -i 's/^UPLOAD_RATE_LIMIT_PER_MINUTE=.*/UPLOAD_RATE_LIMIT_PER_MINUTE=100000/' .env
      # Default image (Tesseract installed, OCR_ENGINE=tesseract): the stack script's
      # OCR check reads a scanned page through the real engine.
      - run: docker compose up -d --build
      - name: Wait for the stack
        run: timeout 600 sh -c 'until curl -fsS http://127.0.0.1:8080/api/v1/health/ready >/dev/null; do sleep 5; done'
      - run: >-
          backend/.venv/bin/python scripts/validation/stack_validation.py
          --uploads "${{ inputs.uploads || '100' }}" --pages "${{ inputs.pages || '500' }}"
      - if: always()
        run: docker compose logs --no-color > compose.log && docker compose down -v
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-validation-report
          path: |
            idp/stack-validation-report.json
            idp/compose.log
