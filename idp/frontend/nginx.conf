# Serves the SPA and proxies /api to the backend so the browser sees one origin.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Uploads arrive in phase 2; keep in sync with the API's MAX_UPLOAD_BYTES.
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Re-resolve the API on every request (Docker DNS) so restarted/scaled API
    # containers are picked up instead of a stale IP cached at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This nginx is the edge: OVERWRITE X-Forwarded-For with the peer address.
        # Appending ($proxy_add_x_forwarded_for) would let clients forge their IP
        # (rate limits, audit). Behind another load balancer, use ngx_http_realip
        # with that balancer's address instead.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # No add_header inside locations: nginx would drop the server-level
    # security headers for that location. `expires` sets Cache-Control instead.
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
