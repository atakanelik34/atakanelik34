[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "idp"
version = "0.1.0"
description = "Intelligent Document Processing platform — API and workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "redis>=5,<6",
    "arq>=0.26",
    "boto3>=1.35",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "pypdfium2>=4.30",
    "pillow>=11",
    "regex>=2024.9",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Optional tracing: set OTEL_EXPORTER_OTLP_ENDPOINT to enable.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "moto[s3]>=5.0",
    "types-boto3>=1.35",
    "types-regex>=2024.9",
]

[project.scripts]
idp = "idp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "C4", "PL"]
ignore = [
    "PLR0913",  # explicit keyword-heavy constructors are intentional (DI)
    "PLR2004",  # magic values are fine in tests/HTTP status checks
    "RUF012",
    "RUF001",   # multilingual document text legitimately uses ı, –, − etc.
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913", "PT018", "E501", "PLC0415"]
"migrations/**" = ["E501"]
"src/idp/domain/templates.py" = ["E501"]
# FastAPI endpoints declare query parameters as function arguments.
"src/idp/api/routes/**" = ["PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["idp"]

[[tool.mypy.overrides]]
module = ["arq.*", "moto.*", "pypdfium2.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires PostgreSQL and Redis (TEST_DATABASE_URL / TEST_REDIS_URL)",
]
filterwarnings = ["error::DeprecationWarning:idp.*"]
